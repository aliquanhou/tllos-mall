# ============================================================
# TLLOS商城 标准Nginx配置（参考福多多架构）
# 版本: v2.0 - 根目录部署，所有前端在public/子目录下
# 原则: 服务器配置是标准规范，项目代码适配服务器
# ============================================================

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name mall.tllos.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mall.tllos.com;

    # SSL证书
    ssl_certificate /etc/letsencrypt/live/mall.tllos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mall.tllos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 根目录：后端Laravel的public目录（所有前端都在这里）
    root /var/www/mall/backend/public;
    index index.php index.html;

    # 基础设置
    client_max_body_size 64M;
    charset utf-8;

    # ============================================================
    # URL重写（参考福多多.htaccess）
    # 所有非真实文件/目录的请求都转发到index.php
    # ============================================================
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
        }
    }

    # ============================================================
    # PHP处理（参考福多多）
    # ============================================================
    location ~ \.php($|/) {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ============================================================
    # 静态资源缓存（参考福多多）
    # ============================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webp)$ {
        expires 7d;
        access_log off;
    }

    # ============================================================
    # 安全头
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
}
