# ============================================================
# TLLOS商城 标准Nginx配置（参考福多多架构）
# 版本: v2.1 - 修复前端路由history模式
# 原则: 服务器配置是标准规范，项目代码适配服务器
# ============================================================

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name mall.tllos.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mall.tllos.com;

    # SSL证书
    ssl_certificate /etc/letsencrypt/live/mall.tllos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mall.tllos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 根目录：后端Laravel的public目录（所有前端都在这里）
    root /var/www/mall/backend/public;
    index index.html index.php;

    # 基础设置
    client_max_body_size 64M;
    charset utf-8;

    # ============================================================
    # API请求 - 交给PHP-FPM处理（Laravel后端）
    # ============================================================
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================================
    # 后台管理前端 - /admin/
    # 支持Vue Router history模式
    # ============================================================
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ============================================================
    # 商家管理前端 - /merchant/
    # 支持Vue Router history模式
    # ============================================================
    location ^~ /merchant/ {
        try_files $uri $uri/ /merchant/index.html;
    }

    # ============================================================
    # 用户端PC前端 - /pc/
    # 支持Vue Router history模式
    # ============================================================
    location ^~ /pc/ {
        try_files $uri $uri/ /pc/index.html;
    }

    # ============================================================
    # 根目录 - 智能入口（自动识别设备并跳转）
    # ============================================================
    location = / {
        try_files /index.html =404;
    }

    # ============================================================
    # 其他请求 - 交给Laravel处理（参考福多多.htaccess）
    # ============================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================================================
    # PHP处理（参考福多多）
    # ============================================================
    location ~ \.php($|/) {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ============================================================
    # 静态资源缓存（参考福多多）
    # ============================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webp)$ {
        expires 7d;
        access_log off;
    }

    # ============================================================
    # 安全头
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
}
