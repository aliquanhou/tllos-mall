name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOFSSH'
            cd /var/www/tllos
            git pull origin main
            cd backend
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            cd ../admin && npm ci && npm run build
            cd ../merchant && npm ci && npm run build
            cd ../pc && npm ci && npm run build
            echo "Deploy completed at $(date)"
          EOFSSH
      
      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          curl -sI https://mall.tllos.com/ | head -5
          curl -sI https://mall.tllos.com/api/v1/products | head -5
      
      - name: Deployment notification
        run: echo "Deployment completed successfully - https://mall.tllos.com/"
