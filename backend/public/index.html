<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <title>TLLOS商城</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loading-container {
      text-align: center;
      color: white;
    }
    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 10px;
    }
    .device-info {
      font-size: 14px;
      opacity: 0.7;
    }
    .manual-links {
      margin-top: 30px;
      display: none;
    }
    .manual-links a {
      display: inline-block;
      padding: 10px 20px;
      margin: 0 10px;
      background: rgba(255,255,255,0.2);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      transition: background 0.3s;
    }
    .manual-links a:hover {
      background: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="logo">TLLOS商城</div>
    <div class="spinner"></div>
    <div class="message" id="message">正在识别设备类型...</div>
    <div class="device-info" id="deviceInfo"></div>
    <div class="manual-links" id="manualLinks">
      <a href="/pc/">PC端</a>
      <a href="/pc/">手机端</a>
    </div>
  </div>

  <script>
    (function() {
      var messageEl = document.getElementById('message');
      var deviceInfoEl = document.getElementById('deviceInfo');
      var manualLinksEl = document.getElementById('manualLinks');

      // 识别设备类型
      function detectDevice() {
        var ua = navigator.userAgent.toLowerCase();
        if (/ipad|tablet|playbook|silk/i.test(ua)) return 'tablet';
        if (/mobile|android|iphone|ipod|blackberry|iemobile|opera mini/i.test(ua)) return 'mobile';
        return 'pc';
      }

      var device = detectDevice();
      var deviceNames = { pc: 'PC电脑', mobile: '手机', tablet: '平板' };
      deviceInfoEl.textContent = '当前设备：' + deviceNames[device];

      // 获取配置并跳转
      function redirectWithConfig() {
        messageEl.textContent = '正在加载跳转配置...';

        fetch('/api/v1/device-redirect/config', {
          headers: { 'Accept': 'application/json' }
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var config = data.data || {};

          // 检查是否启用自动跳转
          if (config.auto_redirect_enabled !== '1' && config.auto_redirect_enabled !== 1) {
            messageEl.textContent = '自动跳转已禁用，请选择访问版本';
            manualLinksEl.style.display = 'block';
            return;
          }

          // 根据设备类型选择跳转地址
          var targetUrl = config.default_redirect_url || '/pc/';
          if (device === 'pc') targetUrl = config.pc_redirect_url || '/pc/';
          else if (device === 'mobile') targetUrl = config.mobile_redirect_url || '/pc/';
          else if (device === 'tablet') targetUrl = config.tablet_redirect_url || '/pc/';

          messageEl.textContent = '正在跳转到 ' + deviceNames[device] + '端...';

          // 延迟一点显示加载动画，然后跳转
          setTimeout(function() {
            window.location.href = targetUrl;
          }, 500);
        })
        .catch(function(err) {
          console.error('获取配置失败，使用默认跳转', err);
          // 获取配置失败，使用默认跳转
          messageEl.textContent = '正在跳转到商城首页...';
          setTimeout(function() {
            window.location.href = '/pc/';
          }, 500);
        });
      }

      // 执行跳转
      redirectWithConfig();
    })();
  </script>
</body>
</html>
